<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ITSE | Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="signup-page">

    <div class="signup-container">

        <!-- LEFT SIDE -->
        <div class="signup-info">

            <div class="logo">
                ITSE
            </div>

            <div class="signup-text">

                <p class="eyebrow">
                    WELCOME TO ITSE
                </p>

                <h1>
                    Enter the
                    <span>Digital Future.</span>
                </h1>

                <p>
                    Create your account and discover a world
                    of technology, innovation, and possibilities.
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="signup-box">

            <h2>
                Create Account
            </h2>

            <p class="subtitle">
                Sign up to continue to ITSE.
            </p>


            <form id="signupForm">

                <!-- NAME -->
                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- TERMS -->
                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the terms and conditions.
                    </span>

                </label>


                <!-- SIGN UP BUTTON -->
                <button
                    type="submit"
                    class="signup-button"
                >
                    Create Account
                </button>

            </form>


            <p
                id="signupMessage"
                class="signup-message"
            ></p>


            <p class="login-text">
                Already have an account?
                <a href="index.html">
                    Sign In
                </a>
            </p>

        </div>

    </div>


    <script src="signup.js"></script>

</body>

</html>
